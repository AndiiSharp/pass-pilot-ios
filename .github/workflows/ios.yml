# Baut die iOS-App auf einem Mac von GitHub, testet sie im iPhone- und iPad-Simulator (Screenshots)
# und laedt sie zu App Store Connect hoch, sobald die Geheimnisse ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, TEAM_ID gesetzt sind.
# Ergebnis (Screenshots, Logs, ggf. IPA): Actions -> Lauf anklicken -> Artifacts "ios-ergebnis".
name: iOS bauen, testen, hochladen
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web-Teil ins iOS-Projekt kopieren
        run: |
          npm install --omit=dev --no-audit --no-fund
          npx cap sync ios
      - name: Bauen, im Simulator testen, ggf. hochladen
        run: sh ios/ci-build.sh
        env:
          BUILD_NR: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASS: ${{ secrets.DIST_P12_PASS }}
          PROFILE_B64: ${{ secrets.PROFILE_B64 }}
          PROFILE_UUID: ${{ secrets.PROFILE_UUID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ergebnis
          path: |
            ios/App/ci-out/*.png
            ios/App/ci-out/*.txt
            ios/App/ci-out/*.ipa
